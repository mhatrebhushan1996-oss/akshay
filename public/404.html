<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0f1e30" />
    <title>Page Not Found | Structeasy</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        align-items: center;
        background: #0f1e30;
        color: #fff;
        display: flex;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        padding: 24px;
      }

      main {
        max-width: 620px;
        text-align: center;
      }

      p:first-child {
        color: #ff4d00;
        font-size: 0.875rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        margin: 0 0 16px;
        text-transform: uppercase;
      }

      h1 {
        font-size: clamp(2.25rem, 8vw, 4.5rem);
        line-height: 1;
        margin: 0;
      }

      h1 + p {
        color: rgba(255, 255, 255, 0.72);
        font-size: 1.05rem;
        line-height: 1.7;
        margin: 24px auto 32px;
      }

      a {
        background: #ff4d00;
        border-radius: 999px;
        color: #fff;
        display: inline-block;
        font-weight: 700;
        padding: 14px 24px;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 3px solid #fff;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <p>404 error</p>
      <h1>Page not found</h1>
      <p>
        The page may have moved or the address may be incorrect. Return to the
        Structeasy homepage to explore our structural engineering services.
      </p>
      <a href="https://structeasy.com/">Return to homepage</a>
    </main>
  </body>
</html>
